services:
  backend:
    build:
      context: .
      dockerfile: ./server/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./server/.env.development
    volumes:
      - ./server/:/app/server/
      - /app/front/.venv/
  frontend:
    build:
      context: .
      dockerfile: ./front/dev.Dockerfile
    env_file:
      - ./front/.env.development
    ports:
      - "5173:5173"
    volumes:
      - ./front:/app/front/
      - /app/node_modules/
