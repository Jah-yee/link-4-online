services:
  backend:
    build:
      context: .
      dockerfile: ./server/Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_HOST: "0.0.0.0"
      APP_ENV: development
    volumes:
      - ./server/:/app/server/
      - /app/front/.venv/
  frontend:
    build:
      context: .
      dockerfile: ./front/dev.Dockerfile
    environment:
      VITE_API_BASE_URL: "http://localhost:8000"
      VITE_WS_BASE_URL: "ws://localhost:8000"
    ports:
      - "5173:5173"
    volumes:
      - ./front:/app/front/
      - /app/node_modules/
