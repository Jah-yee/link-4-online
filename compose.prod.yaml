services:

  backend:
    build:
      context: .
      dockerfile: ./server/Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_HOST: ${APP_HOST}
      APP_ENV: ${APP_ENV}

  frontend:
    build:
      context: .
      dockerfile: ./front/Dockerfile
      args:
        # TODO: Better to read from an environment variable
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL}
    ports:
      - "5173:80"
    volumes:
      - "./front/Caddyfile:/etc/caddy/Caddyfile"
      - "caddy_data:/data"
      - "caddy_config:/config"

volumes:
  caddy_data:
  caddy_config:
